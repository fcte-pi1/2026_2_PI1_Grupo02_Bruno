<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de componentes da solução de software</title><desc id="desc">Serviços Spring publicam eventos de atualização; um listener os encaminha ao adaptador STOMP após o commit da transação.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
  <style>text{font:16px Arial,sans-serif;fill:#172554}.title{font-size:26px;font-weight:bold}.group{fill:#f8fafc;stroke:#64748b;stroke-width:2}.box{fill:#f5f7ff;stroke:#4054a5;stroke-width:2}.external{fill:#fff;stroke:#475569;stroke-width:2}.line{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow)}.label{font-size:13px;fill:#334155}.compact{font-size:13px}</style>
  <rect width="1200" height="760" fill="white"/><text class="title" x="600" y="42" text-anchor="middle">Diagrama de componentes da solução de software</text>
  <rect class="group" x="215" y="90" width="770" height="610" rx="12"/><text x="600" y="120" text-anchor="middle" font-weight="bold">Backend — Spring Boot</text>
  <rect class="external" x="25" y="160" width="155" height="70" rx="8"/><text x="102" y="190" text-anchor="middle">Robô Rato Cego</text><text class="label" x="102" y="213" text-anchor="middle">Sistema embarcado</text>
  <rect class="external" x="25" y="340" width="155" height="70" rx="8"/><text x="102" y="370" text-anchor="middle">Eclipse Mosquitto</text><text class="label" x="102" y="393" text-anchor="middle">Broker MQTT</text>
  <rect class="box" x="275" y="160" width="190" height="70" rx="8"/><text x="370" y="190" text-anchor="middle">MqttRunListener</text><text class="label" x="370" y="213" text-anchor="middle">Eventos do ciclo</text>
  <rect class="box" x="275" y="280" width="190" height="70" rx="8"/><text x="370" y="310" text-anchor="middle">MqttTelemetryListener</text><text class="label" x="370" y="333" text-anchor="middle">Amostras de telemetria</text>
  <rect class="box" x="525" y="160" width="200" height="70" rx="8"/><text x="625" y="190" text-anchor="middle">RunLifecycleService</text><text class="label" x="625" y="213" text-anchor="middle">Ciclo da execução</text>
  <rect class="box" x="525" y="280" width="200" height="70" rx="8"/><text x="625" y="310" text-anchor="middle">TelemetryService</text><text class="label" x="625" y="333" text-anchor="middle">Validação e cálculos</text>
  <rect class="box" x="775" y="220" width="170" height="70" rx="8"/><text x="860" y="250" text-anchor="middle">Repositories</text><text class="label" x="860" y="273" text-anchor="middle">Spring Data JPA</text>
  <rect class="box" x="525" y="420" width="200" height="70" rx="8"/><text x="625" y="450" text-anchor="middle">MqttMessagePublisher</text><text class="label" x="625" y="473" text-anchor="middle">MessagePublisher</text>
  <rect class="box" x="775" y="420" width="170" height="70" rx="8"/><text x="860" y="450" text-anchor="middle">WebSocket Adapter</text><text class="label" x="860" y="473" text-anchor="middle">TelemetryPublisher</text>
  <rect class="external" x="1020" y="220" width="155" height="70" rx="8"/><text x="1097" y="250" text-anchor="middle">PostgreSQL</text><text class="label" x="1097" y="273" text-anchor="middle">Persistência</text>
  <rect class="external" x="1020" y="420" width="155" height="70" rx="8"/><text x="1097" y="450" text-anchor="middle">Frontend React</text><text class="label" x="1097" y="473" text-anchor="middle">REST / STOMP</text>
  <rect class="box" x="275" y="540" width="190" height="70" rx="8"/><text x="370" y="570" text-anchor="middle">RunController</text><text class="label" x="370" y="593" text-anchor="middle">API REST</text>
  <rect class="box" x="525" y="540" width="200" height="70" rx="8"/><text x="625" y="570" text-anchor="middle">Parser / Mapper</text><text class="label" x="625" y="593" text-anchor="middle">Payloads e DTOs</text>
  <rect class="box" x="755" y="535" width="210" height="60" rx="8"/><text class="compact" x="860" y="560" text-anchor="middle">WebSocketUpdateEvent</text><text class="label" x="860" y="582" text-anchor="middle">WebSocketUpdate</text>
  <rect class="box" x="755" y="615" width="210" height="60" rx="8"/><text class="compact" x="860" y="640" text-anchor="middle">WebSocketUpdateEventListener</text><text class="label" x="860" y="662" text-anchor="middle">AFTER_COMMIT</text>
  <path class="line" d="M180 195 L275 195"/><text class="label" x="215" y="184">MQTT</text><path class="line" d="M180 375 L220 375 L220 195 L275 195"/><path class="line" d="M220 375 L275 315"/><path class="line" d="M465 195 L525 195"/><path class="line" d="M465 315 L525 315"/><path class="line" d="M725 195 L775 245"/><path class="line" d="M725 315 L775 260"/><path class="line" d="M945 255 L1020 255"/><path class="line" d="M725 455 L775 455"/><path class="line" d="M945 455 L1020 455"/><path class="line" d="M1020 450 L990 450 L990 575 L465 575"/><path class="line" d="M465 575 L525 575"/><path class="line" d="M370 540 L370 230"/><path class="line" d="M625 230 L750 230 L750 555 L755 555"/><path class="line" d="M725 315 L750 315 L750 575 L755 575"/><path class="line" d="M860 595 L860 615"/><path class="line" d="M755 645 L740 645 L740 455 L775 455"/>
  <text class="label" x="790" y="700">Serviços publicam eventos; o listener AFTER_COMMIT delega ao TelemetryPublisher.</text>
</svg>

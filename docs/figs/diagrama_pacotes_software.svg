<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de pacotes da solução de software</title><desc id="desc">Pacotes do frontend React e backend Spring Boot, com dependências entre serviços, adaptadores e repositórios.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
  <style>text{font:16px Arial,sans-serif;fill:#172554}.title{font-size:26px;font-weight:bold}.group{fill:#f8fafc;stroke:#64748b;stroke-width:2}.box{fill:#f5f7ff;stroke:#4054a5;stroke-width:2}.line{stroke:#475569;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#arrow)}.head{font-weight:bold;font-size:19px}</style>
  <rect width="1100" height="700" fill="white"/><text class="title" x="550" y="42" text-anchor="middle">Diagrama de pacotes da solução de software</text>
  <rect class="group" x="35" y="90" width="280" height="550" rx="12"/><text class="head" x="175" y="125" text-anchor="middle">Frontend React</text>
  <rect class="box" x="85" y="160" width="180" height="55" rx="6"/><text x="175" y="194" text-anchor="middle">components</text>
  <rect class="box" x="85" y="245" width="180" height="55" rx="6"/><text x="175" y="279" text-anchor="middle">api</text>
  <rect class="box" x="85" y="330" width="180" height="55" rx="6"/><text x="175" y="364" text-anchor="middle">realtime</text>
  <rect class="box" x="85" y="415" width="180" height="55" rx="6"/><text x="175" y="449" text-anchor="middle">models</text>
  <rect class="group" x="365" y="90" width="700" height="550" rx="12"/><text class="head" x="715" y="125" text-anchor="middle">Backend Spring Boot</text>
  <rect class="box" x="400" y="165" width="150" height="75" rx="6"/><text x="475" y="195" text-anchor="middle">controller</text><text x="475" y="220" text-anchor="middle">config</text>
  <rect class="box" x="585" y="165" width="190" height="75" rx="6"/><text x="680" y="195" text-anchor="middle">service</text><text x="680" y="220" text-anchor="middle">service.port</text>
  <rect class="box" x="810" y="165" width="210" height="75" rx="6"/><text x="915" y="195" text-anchor="middle">model</text><text x="915" y="220" text-anchor="middle">dto.mqtt / dto.websocket</text>
  <rect class="box" x="400" y="300" width="180" height="75" rx="6"/><text x="490" y="330" text-anchor="middle">adapter.mqtt</text><text x="490" y="355" text-anchor="middle">adapter.websocket</text>
  <rect class="box" x="615" y="300" width="170" height="75" rx="6"/><text x="700" y="330" text-anchor="middle">mapper</text><text x="700" y="355" text-anchor="middle">util</text>
  <rect class="box" x="820" y="300" width="180" height="75" rx="6"/><text x="910" y="330" text-anchor="middle">repository</text><text x="910" y="355" text-anchor="middle">persistence</text>
  <rect class="box" x="585" y="455" width="190" height="65" rx="6"/><text x="680" y="495" text-anchor="middle">Spring Data JPA</text>
  <path class="line" d="M265 188 L400 188"/><path class="line" d="M265 273 L400 205"/><path class="line" d="M265 358 L400 355"/><path class="line" d="M265 443 L810 225"/>
  <path class="line" d="M550 200 L585 200"/><path class="line" d="M775 200 L810 200"/><path class="line" d="M680 240 L700 300"/><path class="line" d="M680 240 L910 300"/><path class="line" d="M490 300 L650 240"/><path class="line" d="M775 340 L820 340"/><path class="line" d="M910 375 L775 475"/><path class="line" d="M550 220 L400 300"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="900" viewBox="0 0 1300 900">
  <style>
    text { font-family: Arial, sans-serif; fill: #000; font-size: 19px; }
    .title { font-size: 29px; font-weight: bold; }
    .node-title { font-size: 21px; font-weight: bold; }
    .small { font-size: 16px; }
    .frame { fill: #fff; stroke: #000; stroke-width: 2.5; }
    .box { fill: #fff; stroke: #000; stroke-width: 2; }
    .wire { fill: none; stroke: #000; stroke-width: 2; }
    .arrow { fill: #000; }
  </style>
  <rect width="1300" height="900" fill="#fff"/>
  <text x="650" y="48" text-anchor="middle" class="title">Diagrama de implantação — Rato Cego</text>

  <rect class="frame" x="50" y="100" width="945" height="715"/>
  <text x="76" y="135" class="node-title">Computador local</text>

  <rect class="box" x="95" y="185" width="360" height="110"/>
  <text x="275" y="225" text-anchor="middle" class="node-title">Navegador</text>
  <text x="275" y="258" text-anchor="middle">Interface React</text>

  <rect class="box" x="595" y="185" width="355" height="110"/>
  <text x="772" y="225" text-anchor="middle" class="node-title">Servidor frontend</text>
  <text x="772" y="258" text-anchor="middle">Vite ou arquivos compilados</text>

  <rect class="box" x="95" y="365" width="360" height="125"/>
  <text x="275" y="407" text-anchor="middle" class="node-title">Backend Spring Boot</text>
  <text x="275" y="440" text-anchor="middle">API REST e WebSocket</text>

  <rect class="box" x="595" y="365" width="355" height="125"/>
  <text x="772" y="407" text-anchor="middle" class="node-title">Mosquitto</text>
  <text x="772" y="440" text-anchor="middle">Contêiner Docker · porta 1883</text>

  <rect class="box" x="95" y="590" width="360" height="125"/>
  <text x="275" y="632" text-anchor="middle" class="node-title">PostgreSQL</text>
  <text x="275" y="665" text-anchor="middle">Banco de dados local</text>
  <text x="275" y="693" text-anchor="middle" class="small">Armazenamento persistente</text>

  <rect class="box" x="1040" y="365" width="210" height="125"/>
  <text x="1145" y="407" text-anchor="middle" class="node-title">Robô</text>
  <text x="1145" y="440" text-anchor="middle">Cliente MQTT</text>

  <path class="wire" d="M455 230 H595"/>
  <polygon class="arrow" points="587,224 595,230 587,236"/>
  <text x="525" y="213" text-anchor="middle" class="small">HTTP</text>

  <path class="wire" d="M235 295 V365"/>
  <polygon class="arrow" points="229,357 235,365 241,357"/>
  <polygon class="arrow" points="229,303 235,295 241,303"/>
  <text x="155" y="334" class="small">REST / WebSocket</text>

  <path class="wire" d="M455 425 H595"/>
  <polygon class="arrow" points="587,419 595,425 587,431"/>
  <polygon class="arrow" points="463,419 455,425 463,431"/>
  <text x="525" y="407" text-anchor="middle" class="small">MQTT</text>

  <path class="wire" d="M300 490 V590"/>
  <polygon class="arrow" points="294,582 300,590 306,582"/>
  <polygon class="arrow" points="294,498 300,490 306,498"/>
  <text x="315" y="545" class="small">Protocolo PostgreSQL</text>

  <path class="wire" d="M950 425 H1040"/>
  <polygon class="arrow" points="1032,419 1040,425 1032,431"/>
  <polygon class="arrow" points="958,419 950,425 958,431"/>
  <text x="995" y="340" text-anchor="middle" class="small">Rede local</text>
  <text x="995" y="362" text-anchor="middle" class="small">MQTT: porta 1883 do Mosquitto</text>

  <text x="50" y="855" class="small">A porta 1883 é exposta no computador para a conexão do robô pela rede local.</text>
</svg>
